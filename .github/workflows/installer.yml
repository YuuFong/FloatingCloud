name: Build FloatingCloud Offline Setup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/**'
      - 'plugin/**'
      - 'native/**'
      - 'lyric-helper/**'
      - 'tools/**'
      - '.github/workflows/installer.yml'
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'plugin/**'
      - 'native/**'
      - 'lyric-helper/**'
      - 'tools/**'
      - '.github/workflows/installer.yml'
  release:
    types: [published]

jobs:
  build-installer:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate matching release version
        if: github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Get-Content plugin/manifest.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version" -and $env:RELEASE_TAG -ne "$version") {
            throw "Release tag $env:RELEASE_TAG does not match plugin v$version"
          }
      - name: Run plugin tests
        shell: pwsh
        run: |
          node --check plugin/main.js
          node --check plugin/update-check.js
          node --test tools/core.test.js tools/position.test.js tools/ncm-path.test.js tools/ncm-directory-integration.test.js tools/playback-events.test.js tools/glow-render.test.js tools/spectrum-scene.test.js tools/test-update-check.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Plugin tests failed' }
      - name: Build full Windows x64 plugin
        shell: pwsh
        run: |
          & .\tools\build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native plugin build failed' }
          $version = (Get-Content plugin/manifest.json -Raw | ConvertFrom-Json).version
          $package = "FloatingCloud-v$version.plugin"
          python tools/validate-plugin-package.py $package
          if ($LASTEXITCODE -ne 0) { throw 'Plugin package validation failed' }
          New-Item -ItemType Directory -Force dist/bundled | Out-Null
          Copy-Item $package dist/bundled/FloatingCloud.plugin
          Copy-Item $package dist/
      - name: Download official InfLink-rs plugin release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.4.0 --repo apoint123/inflink-rs --pattern 'InfLink-rs.plugin' --dir dist/bundled
          if ($LASTEXITCODE -ne 0) { throw 'Official InfLink-rs download failed' }
          python installer/validate-inflink.py dist/bundled/InfLink-rs.plugin
          if ($LASTEXITCODE -ne 0) { throw 'InfLink-rs plugin package validation failed' }
          Get-FileHash dist/bundled/InfLink-rs.plugin -Algorithm SHA256 | Format-List
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/apoint123/inflink-rs/main/LICENSE' -OutFile dist/bundled/InfLink-rs-LICENSE.txt
          if (!(Select-String -Path dist/bundled/InfLink-rs-LICENSE.txt -Pattern 'GNU GENERAL PUBLIC LICENSE' -Quiet)) { throw 'Missing third party GPL license' }
      - name: Bundle last official BetterNCM v1.3.4 x64 DLL
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.3.4 --repo std-microblock/chromatic --pattern 'BetterNCMII.dll' --dir dist/bundled
          if ($LASTEXITCODE -ne 0) { throw 'Official BetterNCM DLL download failed' }
          python installer/validate-betterncm.py dist/bundled/BetterNCMII.dll
          if ($LASTEXITCODE -ne 0) { throw 'BetterNCM DLL validation failed' }
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/std-microblock/chromatic/1.3.4/LICENSE' -OutFile dist/bundled/BetterNCM-LICENSE.txt
          if (!(Select-String -Path dist/bundled/BetterNCM-LICENSE.txt -Pattern 'GNU GENERAL PUBLIC LICENSE' -Quiet)) { throw 'Missing BetterNCM GPL license' }
      - name: Build self-contained EXE with embedded plugin
        shell: pwsh
        run: |
          dotnet publish installer/FloatingCloud.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:IncludeNativeLibrariesForSelfExtract=true -o dist/installer
          if ($LASTEXITCODE -ne 0) { throw 'Installer publish failed' }
          Rename-Item dist/installer/FloatingCloud.Setup.exe FloatingCloud-Setup.exe
          if (!(Test-Path dist/installer/FloatingCloud-Setup.exe)) { throw 'Missing Setup EXE' }
          $pluginSize = (Get-Item dist/bundled/FloatingCloud.plugin).Length + (Get-Item dist/bundled/InfLink-rs.plugin).Length + (Get-Item dist/bundled/BetterNCMII.dll).Length
          $setupSize = (Get-Item dist/installer/FloatingCloud-Setup.exe).Length
          if ($setupSize -le $pluginSize) { throw 'EXE may not contain bundled plugin' }
          Get-FileHash dist/installer/FloatingCloud-Setup.exe -Algorithm SHA256 | Format-List
          $version = (Get-Content plugin/manifest.json -Raw | ConvertFrom-Json).version
          & .\\dist\\installer\\FloatingCloud-Setup.exe --self-test $version
          if ($LASTEXITCODE -ne 0) { throw "Embedded resource self-test failed: $LASTEXITCODE" }
      - name: Upload installer and plugin as test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FloatingCloud-Offline-Setup-win-x64
          path: |
            dist/installer/FloatingCloud-Setup.exe
            dist/FloatingCloud-v*.plugin
          if-no-files-found: error
          retention-days: 30
      - name: Publish v0.4.42 with both validated assets
        # Explicit one-time release marker: ordinary main pushes never publish.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v0.4.42]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content plugin/manifest.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.4.42') { throw "Unexpected manifest version: $version" }
          $tag = "v$version"
          $plugin = "dist/FloatingCloud-v$version.plugin"
          $setup = "dist/installer/FloatingCloud-Setup.exe"
          foreach ($file in @($plugin, $setup, 'release-notes/v0.4.42.md')) {
            if (!(Test-Path $file)) { throw "Missing release component: $file" }
          }
          gh release view $tag --repo $env:GH_REPO 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Refusing duplicate publication." }
          gh release create $tag $plugin $setup --repo $env:GH_REPO --target $env:GITHUB_SHA --title "FloatingCloud $tag" --notes-file release-notes/v0.4.42.md --draft
          if ($LASTEXITCODE -ne 0) { throw "Failed to create draft $tag with assets" }
          $assets = @(gh release view $tag --repo $env:GH_REPO --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0 -or $assets.Count -ne 2 -or
              $assets -notcontains "FloatingCloud-v0.4.42.plugin" -or
              $assets -notcontains "FloatingCloud-Setup.exe") {
            throw "Draft assets incomplete: $($assets -join ', '). Release remains draft."
          }
          gh release edit $tag --repo $env:GH_REPO --draft=false --prerelease=false
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish $tag. Release remains draft." }
          gh release view $tag --repo $env:GH_REPO --json url --jq '.url'
          if ($LASTEXITCODE -ne 0) { throw "Published but final verification failed." }
      - name: Attach both assets to the matching GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $package = (Get-ChildItem dist/FloatingCloud-v*.plugin | Select-Object -First 1).FullName
          gh release upload "$env:RELEASE_TAG" $package "dist/installer/FloatingCloud-Setup.exe" --clobber
