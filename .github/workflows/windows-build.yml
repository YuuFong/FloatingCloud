name: FloatingCloud Native Win64
on:
  workflow_dispatch:
  push:
    paths:
      - 'plugin/**'
      - 'native/**'
      - 'tools/**'
      - '.github/workflows/windows-build.yml'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run JavaScript lyric tests
        shell: pwsh
        run: |
          node --check plugin/core.js
          node --check plugin/main.js
          node --test tools/core.test.js tools/position.test.js
      - name: Build and package x64 plugin
        shell: pwsh
        run: .\tools\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingCloud-plugin-win64
          path: FloatingCloud-v0.4.5.plugin
